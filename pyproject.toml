[project]
name = "signalpost-norway-agent"
version = "0.1.0"
description = "Norway company-intelligence agent for the Builderr.ai Signalpost challenge"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
