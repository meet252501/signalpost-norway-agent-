services:
  agent:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    # Reproducible local run of a batch, respecting the same
    # request/time/cost budget the real evaluation enforces.

  api:
    build: .
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
